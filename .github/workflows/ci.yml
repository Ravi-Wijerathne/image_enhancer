name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - edit
  pull_request:
    branches:
      - main
      - master
      - edit

jobs:
  mobile-tests:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze

      - name: Run widget & unit tests
        working-directory: mobile
        run: flutter test
